# Fierauto production stack — Docker Compose
# Usage: see DEPLOY_PRODUCTION.md and deploy.sh

name: fierauto

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: fierauto-app:latest
    restart: unless-stopped
    env_file:
      - .env.production
    environment:
      NODE_ENV: production
      PORT: "3000"
    volumes:
      - fierauto-data:/app/data
      - fierauto-uploads:/app/public/uploads
      - fierauto-hero:/app/public/hero
      - fierauto-logo:/app/public/logo
      - fierauto-car-uploads:/app/public/cars/uploads
    networks:
      - fierauto-internal
    logging:
      driver: json-file
      options:
        max-size: "20m"
        max-file: "5"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    depends_on:
      app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./deploy/nginx/active.conf:/etc/nginx/conf.d/default.conf:ro
      - ./deploy/nginx/admin-auth-locations.conf:/etc/nginx/admin-auth-locations.conf:ro
      - ./deploy/nginx/.htpasswd:/etc/nginx/.htpasswd:ro
      - certbot-conf:/etc/letsencrypt:ro
      - certbot-www:/var/www/certbot:ro
    networks:
      - fierauto-internal
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  certbot:
    image: certbot/certbot:latest
    restart: unless-stopped
    volumes:
      - certbot-conf:/etc/letsencrypt
      - certbot-www:/var/www/certbot
    networks:
      - fierauto-internal
    entrypoint: /bin/sh
    command: >
      -c "trap exit TERM;
      while :; do
        certbot renew --webroot -w /var/www/certbot --quiet;
        sleep 12h & wait $${!};
      done"

volumes:
  fierauto-data:
  fierauto-uploads:
  fierauto-hero:
  fierauto-logo:
  fierauto-car-uploads:
  certbot-conf:
  certbot-www:

networks:
  fierauto-internal:
    driver: bridge
