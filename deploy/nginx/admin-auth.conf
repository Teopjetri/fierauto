# Optional — protect admin and listing write APIs (HTTP Basic Auth)
# Enable in default.ssl.conf: include /etc/nginx/conf.d/admin-auth.conf;
# Generate credentials: ./deploy.sh setup-auth

location ^~ /admin {
    auth_basic "Fierauto Admin";
    auth_basic_user_file /etc/nginx/.htpasswd;
    proxy_pass http://app:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /api/listings {
    auth_basic "Fierauto Admin";
    auth_basic_user_file /etc/nginx/.htpasswd;
    proxy_pass http://app:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ~ ^/api/(hero|logo)$ {
    limit_except GET {
        auth_basic "Fierauto Admin";
        auth_basic_user_file /etc/nginx/.htpasswd;
    }
    proxy_pass http://app:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}

location ^~ /api/cars/ {
    auth_basic "Fierauto Admin";
    auth_basic_user_file /etc/nginx/.htpasswd;
    proxy_pass http://app:3000;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
