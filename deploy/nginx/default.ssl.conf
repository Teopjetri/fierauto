# HTTPS production — requires certificates in /etc/letsencrypt/live/fierauto.it/
# Managed by deploy.sh after certbot certonly

server {
    listen 80;
    server_name fierauto.it www.fierauto.it;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://fierauto.it$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name www.fierauto.it;

    ssl_certificate /etc/letsencrypt/live/fierauto.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fierauto.it/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    return 301 https://fierauto.it$request_uri;
}

server {
    listen 443 ssl;
    http2 on;
    server_name fierauto.it;

    ssl_certificate /etc/letsencrypt/live/fierauto.it/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/fierauto.it/privkey.pem;
    ssl_session_timeout 1d;
    ssl_session_cache shared:SSL:10m;
    ssl_protocols TLSv1.2 TLSv1.3;

    add_header X-Frame-Options "SAMEORIGIN" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    client_max_body_size 25M;

    # Optional admin/API protection — enable: ./deploy.sh setup-auth
    # include /etc/nginx/admin-auth-locations.conf;

    location / {
        proxy_pass http://app:3000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 120s;
    }
}
